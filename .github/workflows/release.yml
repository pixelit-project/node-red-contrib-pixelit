name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e 'const version = require("./package.json").version; if (process.env.RELEASE_TAG !== version && process.env.RELEASE_TAG !== `v${version}`) { console.error("Release tag must match package.json version"); process.exit(1); }'

      - name: Install Dependencies
        run: npm ci

      - name: Check syntax and examples
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Publish package to npm using OIDC
        run: npm publish
